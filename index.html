<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kibble's Rune Library · UO Outlands</title>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0f13; --panel:#15171d; --panel2:#1c1f27; --line:#2a2e39;
    --text:#e6e1d6; --muted:#9a968c; --gold:#d6b25e; --gold2:#f0d48a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
  #app{display:flex;height:100%}
  aside{width:350px;min-width:350px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  h1{font:700 20px Cinzel,serif;color:var(--gold2);margin:0 0 2px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12px}
  .search{margin-top:12px;width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;outline:none}
  .search:focus{border-color:var(--gold)}
  .sbox{position:relative;margin-top:12px}
  .sbox .search{margin-top:0;padding-right:34px}
  .sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;display:none}
  .sclear:hover{background:#262a35;color:var(--gold2)}
  .sbox.has .sclear{display:block}
  .leaflet-tooltip.lbl{background:rgba(14,15,19,.82);border:0;padding:1px 5px;font:600 11px Inter,sans-serif;color:#f3eee2;border-radius:4px;white-space:nowrap;pointer-events:none}
  .leaflet-tooltip.lbl.focus{color:var(--gold2);font-size:12px}
  #map.nolabels .leaflet-tooltip.lbl.ov{display:none}
  .hint{margin-top:8px;color:var(--muted);font-size:11.5px}
  #list{flex:1;overflow:auto;padding:8px}
  .set{margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
  .set>summary{list-style:none;cursor:pointer;padding:9px 10px;display:flex;align-items:center;gap:9px}
  .set>summary::-webkit-details-marker{display:none}
  .set>summary:hover{background:#222632}
  .sw{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.5)}
  .set .nm{flex:1;font-weight:600}
  .count{color:var(--muted);font-size:12px;white-space:nowrap}
  .books{padding:2px 6px 8px}
  .book{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;color:#cfcabe}
  .book:hover{background:#262a35}
  .book.active{background:#33291a;color:var(--gold2)}
  .book .nm{flex:1}
  input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px;margin:0;cursor:pointer;flex:none}
  .setlinks{display:flex;gap:6px;padding:4px 8px 6px;flex-wrap:wrap}
  .btn{font:500 12px Inter,sans-serif;color:var(--text);background:#262a35;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;text-decoration:none}
  .btn:hover{border-color:var(--gold);color:var(--gold2)}
  .btn.on{border-color:var(--gold);color:var(--gold2)}
  #detail{position:absolute;right:10px;top:50px;bottom:48px;width:300px;z-index:650;background:rgba(21,23,29,.95);border:1px solid var(--line);border-radius:10px;display:none;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.5);height:max-content;max-height:calc(100% - 98px)}
  #detail.on{display:flex}
  #detail .hd{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;gap:8px;align-items:center}
  #detail .hd b{flex:1;font:700 14px Cinzel,serif;color:var(--gold2)}
  #runes{overflow-y:auto;overflow-x:hidden;padding:0 8px 10px;margin:0;list-style:none}
  #runes li{display:flex;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
  #runes li:hover{background:#262a35}
  #runes .n{width:22px;text-align:right;color:var(--gold);flex:none}
  #runes .c{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  main{flex:1;position:relative;overflow:hidden}
  #map{position:absolute;inset:0;background:#000}
  .tools{position:absolute;right:10px;top:10px;z-index:700;display:flex;gap:6px}
  .tools .btn{background:rgba(21,23,29,.92)}
  .coords{position:absolute;right:10px;bottom:10px;z-index:500;background:rgba(14,15,19,.85);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ctag{font-size:10px;font-weight:600;color:#1a1408;background:#c48bf0;border-radius:4px;padding:1px 5px;margin-left:6px}
  .leaflet-tooltip.lbl.arealbl{background:rgba(214,178,94,.92);color:#1a1408;font-size:12px}
  .mkicon{filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
  .stairs{width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.7)}
  .stairs svg{width:16px;height:16px}
  .stairs.up{background:#059669}
  .stairs.down{background:#0284c7}
  .pin.hit{width:26px;height:26px;background:#ff4d6d;color:#fff;border:2px solid #fff;font-size:12px;position:relative;box-shadow:0 0 0 2px rgba(0,0,0,.6)}
  .pin.hit::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid #ff4d6d;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
  .leaflet-tooltip.lbl.hitlbl{background:#ff4d6d;color:#fff;font-size:12px}
  #map.searching .leaflet-overlay-pane{opacity:.3}
  #map.searching .leaflet-tooltip.lbl.ov{opacity:.3}
  .pin{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a1408;border:2px solid #1a1408;display:grid;place-items:center;font:700 10px Inter,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .leaflet-popup-content{margin:10px 12px;font:13px Inter,sans-serif;min-width:200px}
  .leaflet-popup-content b{color:var(--gold2)}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
  .leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--line);font:12px Inter,sans-serif;box-shadow:none}
  .leaflet-tooltip:before{display:none}
  .leaflet-tooltip.hovertip{padding:9px 12px;border-radius:10px;min-width:200px;white-space:normal;font:13px Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  .leaflet-tooltip.hovertip b{color:var(--gold2)}
  .pop-meta{color:var(--muted);font-size:12px;margin-top:3px}
  .near{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .near div{display:flex;gap:6px;align-items:center;font-size:12px;padding:2px 0;cursor:pointer}
  .near div:hover{color:var(--gold2)}
  .near .d{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  @media (max-width:760px){
    #app{flex-direction:column-reverse}
    aside{width:100%;min-width:0;height:45%}
    #detail{width:auto;left:10px;top:auto;max-height:45%}
    main{height:55%}
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Kibble's Rune Library</h1>
      <div class="sub" id="stats">Loading…</div>
      <div class="sbox" id="sbox"><input id="q" class="search" placeholder="Search runes, creatures or X, Y…" autocomplete="off"><button class="sclear" id="qclear" title="Clear search">×</button></div>
      <div class="hint">Tick a set or book to keep it on the map as an overlay. Click a book name to focus it. Creature data from <a href="https://www.outlandsbutler.com/creaturelibrary" target="_blank" rel="noopener" style="color:var(--gold)">Outlands Butler</a>. Stairs icon by Delapouite (<a href="https://game-icons.net" target="_blank" rel="noopener" style="color:var(--gold)">game-icons.net</a>, CC BY 3.0).</div>
    </header>
    <div id="list"></div>
  </aside>
  <main>
    <div id="map"></div>
    <div class="tools">
      <button class="btn" id="gateBtn" title="Show moongates and dungeon stairs">Gates &amp; stairs</button>
      <button class="btn" id="lblBtn" title="Show rune names on overlay pins">Labels</button>
      <button class="btn" id="clearOv">Clear overlays</button>
    </div>
    <div id="detail">
      <div class="hd"><b id="dTitle"></b>
        <button class="btn" id="dExport" title="Download ClassicUO map markers">Export XML</button>
        <button class="btn" id="dClose">✕</button>
      </div>
      <ol id="runes"></ol>
    </div>
    <div class="coords" id="coords">–</div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
const MAP_W = 8960, MAP_H = 4096, NATIVE = 5, SURFACE_W = 4736;
const PALETTE = ['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6','#bcf60c','#fabebe','#00c2a8','#e6beff','#ffffff','#fffac8','#aaffc3','#ffd8b1'];
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const map = L.map('map', { crs: L.CRS.Simple, minZoom: 1, maxZoom: 7, zoomSnap: 0.5, attributionControl: false,
  rotate: true, bearing: 0, rotateControl: false, touchRotate: false, shiftKeyRotate: false });
map.createPane('searchPane', map._norotatePane || undefined).style.zIndex = 690;   // above overlay pins and labels, below popups (same stacking context as popupPane)
const toLL = (x, y) => map.unproject([x + 0.5, y + 0.5], NATIVE);
const toXY = ll => { const p = map.project(ll, NATIVE); return [Math.floor(p.x), Math.floor(p.y)]; };
const bounds = L.latLngBounds(toLL(0, 0), toLL(MAP_W, MAP_H));
// When rotated, the visible area is larger than the unrotated view box: load tiles covering its full diagonal
const RotatedTiles = L.TileLayer.extend({
  _getTiledPixelBounds(center) {
    const b = L.TileLayer.prototype._getTiledPixelBounds.call(this, center), sz = b.getSize();
    const d = Math.hypot(sz.x, sz.y), px = (d - sz.x) / 2 + 256, py = (d - sz.y) / 2 + 256;
    return L.bounds(b.min.subtract([px, py]), b.max.add([px, py]));
  }
});
new RotatedTiles('tiles/{z}/{x}/{y}.png', { maxNativeZoom: NATIVE, maxZoom: 7, minZoom: 1, bounds, noWrap: true, keepBuffer: 4, updateWhenZooming: false, updateWhenIdle: true }).addTo(map);
map.fitBounds(L.latLngBounds(toLL(0, 0), toLL(SURFACE_W, MAP_H)));

// Rotated 45° clockwise to match the in-game view
map.setBearing(45);

const coordsEl = document.getElementById('coords');
map.on('mousemove', e => { const [x, y] = toXY(e.latlng); coordsEl.textContent = `X ${x}, Y ${y}`; });

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const focusLayer = L.layerGroup().addTo(map);
const overlayLayer = L.layerGroup().addTo(map);
let DATA, RUNES, current = null;
let overlays = new Set(store.get('overlays', []));   // keys: "<setId>|<bookId>"
const bookKey = (s, b) => `${s.setId}|${b.id}`;
const bookRunes = b => b.runeIds.map(id => RUNES[id]).filter(r => r && r.location);

function hitIcon(label = '') {
  return L.divIcon({ className: '', html: `<div class="pin hit">${esc(label)}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
}
function hitMarker(ll, r, b, label) {
  return bindRune(L.marker(ll, { icon: hitIcon(label), pane: 'searchPane' }), r, b)
    .bindTooltip(esc(r.fullName), { permanent: true, direction: 'right', offset: [16, 0], className: 'lbl hitlbl', pane: 'searchPane' });
}
let fitTimer = null;
function fitHits(lls) {
  clearTimeout(fitTimer);
  if (!lls.length) return;
  fitTimer = setTimeout(() => lls.length === 1 ? map.flyTo(lls[0], Math.max(map.getZoom(), 5)) : map.flyToBounds(L.latLngBounds(lls).pad(0.3), { maxZoom: 5 }), 450);
}
function pinIcon(label) {
  return L.divIcon({ className: '', html: `<div class="pin">${esc(label)}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
}

// Nearest rune from each overlay set (excluding the rune's own book)
// Dungeon interiors sit beside the overworld; measure them from their overworld entrance instead
let ENTR = {};
function worldPos(r) {
  if (r.location.x < SURFACE_W) return { x: r.location.x, y: r.location.y, via: null };
  const base = r.fullName.replace(/\s+(level \d+|dungeon|(east|west|north|south) inside)$/i, '').toLowerCase();
  const e = ENTR[base];
  return e ? { x: e.location.x, y: e.location.y, via: e } : null;
}
function nearestHtml(r, ownBook) {
  const from = worldPos(r);
  if (!from) return '';
  const best = new Map();
  for (const s of DATA.sets) for (const b of s.books) {
    if (!overlays.has(bookKey(s, b)) || b === ownBook) continue;
    for (const o of bookRunes(b)) {
      if (o === r) continue;
      const to = worldPos(o); if (!to || to.via === r || o === from.via) continue;
      const d = Math.hypot(to.x - from.x, to.y - from.y);
      const cur = best.get(s.setId);
      if (!cur || d < cur.d) best.set(s.setId, { d, o, s, b });
    }
  }
  if (!best.size) return '';
  const rows = [...best.values()].sort((a, b) => a.d - b.d).map(({ d, o, s, b }) =>
    `<div data-x="${o.location.x}" data-y="${o.location.y}"><span class="sw" style="background:${s.color}"></span><span>${esc(o.fullName)}<br><span class="pop-meta" style="margin:0">${esc(b.name)}</span></span><span class="d">${Math.round(d)} tiles</span></div>`).join('');
  const via = from.via ? ` (from ${esc(from.via.fullName)})` : '';
  return `<div class="near"><div class="pop-meta" style="cursor:default">Nearest overlay runes${via}</div>${rows}</div>`;
}
function popupHtml(r, book) {
  return `<b>${esc(r.fullName)}</b><div class="pop-meta">${book ? esc(book.name) + ' · ' : ''}X ${r.location.x}, Y ${r.location.y}</div>${nearestHtml(r, book)}`;
}
map.on('popupopen', e => {
  e.popup.getElement().querySelectorAll('.near div[data-x]').forEach(el => el.onclick = () =>
    map.flyTo(toLL(+el.dataset.x, +el.dataset.y), Math.max(map.getZoom(), 5)));
});
// Hover: temporary preview that disappears on mouse-out. Click: pinned popup that stays until closed with ×.
let hoverTip = null;
function hideHover() { if (hoverTip) { hoverTip.remove(); hoverTip = null; } }
function bindRune(m, r, book) {
  m.bindPopup(() => popupHtml(r, book), { autoPan: true, autoPanPaddingTopLeft: [20, 60], autoPanPaddingBottomRight: [340, 40], closeOnClick: false });
  m.off('click', m._openPopup);
  m.on('click', e => { L.DomEvent.stop(e); hideHover(); if (!m.isPopupOpen()) m.openPopup(); });
  m.on('mouseover', () => {
    if (m.isPopupOpen()) return;
    hideHover();
    hoverTip = L.tooltip({ className: 'hovertip', direction: 'top', offset: [0, -12], opacity: 1, pane: 'popupPane' })
      .setLatLng(m.getLatLng()).setContent(popupHtml(r, book)).addTo(map);
  });
  m.on('mouseout', hideHover);
  return m;
}

// Overlays: each book's pins are built once and cached; toggling just adds/removes the cached group
const bookLayers = new Map();   // bookKey -> { group, markers: [{ m, r }] }
function getBookLayer(s, b) {
  const k = bookKey(s, b);
  if (!bookLayers.has(k)) {
    const group = L.layerGroup(), markers = [];
    for (const r of bookRunes(b)) {
      const m = bindRune(L.circleMarker(toLL(r.location.x, r.location.y), { radius: 6, bubblingMouseEvents: false, color: '#000', weight: 1, fillColor: s.color, fillOpacity: 0.95 }), r, b);
      group.addLayer(m); markers.push({ m, r });
    }
    bookLayers.set(k, { group, markers });
  }
  return bookLayers.get(k);
}
function drawOverlays() {
  for (const s of DATA.sets) for (const b of s.books) {
    const on = overlays.has(bookKey(s, b)), cached = bookLayers.get(bookKey(s, b));
    if (on) { const l = getBookLayer(s, b); if (!overlayLayer.hasLayer(l.group)) overlayLayer.addLayer(l.group); }
    else if (cached && overlayLayer.hasLayer(cached.group)) overlayLayer.removeLayer(cached.group);
  }
  store.set('overlays', [...overlays]);
  scheduleLabels();
}

// Overlay labels: only for pins currently on screen, rebuilt after pan/zoom settles (capped for speed)
let labelMode = store.get('labelMode', 'auto');   // auto | on | off
const labelLayer = L.layerGroup().addTo(map);
const MAX_LABELS = 300;
let labelTimer = null;
function scheduleLabels() { clearTimeout(labelTimer); labelTimer = setTimeout(refreshLabels, 120); }
function labelsWanted() { return labelMode === 'on' || (labelMode === 'auto' && map.getZoom() >= 4); }
function refreshLabels() {
  labelLayer.clearLayers();
  if (!labelsWanted()) return;
  const view = map.getBounds().pad(0.1), c = map.getCenter(), cand = [];
  for (const { group, markers } of bookLayers.values()) {
    if (!overlayLayer.hasLayer(group)) continue;
    for (const { m, r } of markers) { const ll = m.getLatLng(); if (view.contains(ll)) cand.push({ ll, r, d: (ll.lat - c.lat) ** 2 + (ll.lng - c.lng) ** 2 }); }
  }
  cand.sort((a, b) => a.d - b.d);
  for (const { ll, r } of cand.slice(0, MAX_LABELS))
    labelLayer.addLayer(L.tooltip({ permanent: true, direction: 'right', offset: [6, 0], className: 'lbl ov', interactive: false }).setLatLng(ll).setContent(esc(r.fullName)));
}
map.on('zoomstart', () => { clearTimeout(labelTimer); labelLayer.clearLayers(); });
map.on('moveend zoomend', scheduleLabels);

function showBook(set, book, el) {
  current = { set, book };
  document.querySelectorAll('.book.active').forEach(b => b.classList.remove('active'));
  el && el.classList.add('active');
  focusLayer.clearLayers();
  const rs = bookRunes(book), pts = [];
  const ol = document.getElementById('runes'); ol.innerHTML = '';
  rs.forEach((r, i) => {
    const ll = toLL(r.location.x, r.location.y); pts.push(ll);
    const m = bindRune(L.marker(ll, { icon: pinIcon(i + 1), zIndexOffset: 1000 }), r, book)
      .bindTooltip(esc(r.fullName), { permanent: true, direction: 'right', offset: [12, 0], className: 'lbl focus' }).addTo(focusLayer);
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span>${esc(r.fullName)}</span><span class="c">${r.location.x}, ${r.location.y}</span>`;
    li.onclick = () => { map.flyTo(ll, Math.max(map.getZoom(), 5)); m.openPopup(); };
    ol.appendChild(li);
  });
  document.getElementById('dTitle').textContent = `${book.name} (${rs.length})`;
  document.getElementById('dExport').style.display = '';
  document.getElementById('detail').classList.add('on');
  if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 5 });
}

function exportXml(name, runes) {
  const x = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const body = runes.map(r => `<Marker Name="${x(r.fullName)}" Facet="0" Icon="TELEPORTER" Color="black" Y="${r.location.y}" X="${r.location.x}"/>`).join('\n\n');
  const xml = `<?xml version="1.0" encoding="UTF-8"?><Pack Name="${x(name)}" Revision="0">\n\n${body}\n\n</Pack>\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([xml], { type: 'application/xml' }));
  a.download = name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.xml';
  a.click();
}

function syncSetBox(s, box) {
  const n = s.books.filter(b => overlays.has(bookKey(s, b))).length;
  box.checked = n === s.books.length; box.indeterminate = n > 0 && n < s.books.length;
}

// Creatures (decoded from Outlands Butler's creature library), loaded on first search
let CREATURES = null, creaturesLoading = null, ALLRUNES = null;
function loadCreatures() {
  if (!creaturesLoading) creaturesLoading = fetch('data/creatures.json').then(r => r.json()).then(d => { CREATURES = d; }).catch(() => { CREATURES = []; });
  return creaturesLoading;
}
function allRunes() {
  if (!ALLRUNES) { ALLRUNES = []; DATA.sets.forEach(s => s.books.forEach(b => bookRunes(b).forEach(r => { const p = worldPos(r); if (p) ALLRUNES.push({ s, b, r, p }); }))); }
  return ALLRUNES;
}
function nearestRunes(x, y, n = 3) {
  return allRunes().map(o => ({ ...o, d: Math.hypot(o.p.x - x, o.p.y - y) })).sort((a, b) => a.d - b.d).slice(0, n);
}
function dungeonEntrance(name) {
  const base = name.replace(/\s+level.*$/i, '').replace(/^the\s+/i, '').toLowerCase();
  if (ENTR[base]) return ENTR[base];
  // fallback: any overworld rune mentioning the dungeon, preferring "entrance" ones
  const c = allRunes().filter(o => o.r.location.x < SURFACE_W && o.r.fullName.toLowerCase().includes(base));
  c.sort((a, b) => (/entrance/i.test(b.r.fullName) - /entrance/i.test(a.r.fullName)) || a.r.fullName.length - b.r.fullName.length);
  return c.length ? c[0].r : null;
}
function showCreature(c) {
  current = null;
  document.querySelectorAll('.book.active').forEach(b => b.classList.remove('active'));
  focusLayer.clearLayers();
  const ol = document.getElementById('runes'); ol.innerHTML = ''; const lls = [];
  c.s.forEach(([name, x, y], i) => {
    const ll = toLL(x, y); lls.push(ll);
    const near = nearestRunes(x, y, 3);
    const html = `<b>${esc(c.n)}</b><div class="pop-meta">${esc(name)} · X ${x}, Y ${y}</div><div class="near"><div class="pop-meta" style="cursor:default">Nearest runes</div>` +
      near.map(o => `<div data-x="${o.r.location.x}" data-y="${o.r.location.y}"><span class="sw" style="background:${o.s.color}"></span><span>${esc(o.r.fullName)}<br><span class="pop-meta" style="margin:0">${esc(o.b.name)}</span></span><span class="d">${Math.round(o.d)} tiles</span></div>`).join('') + '</div>';
    const m = L.marker(ll, { icon: hitIcon(i + 1), pane: 'searchPane' }).bindPopup(html, { autoPan: true, autoPanPaddingTopLeft: [20, 60], autoPanPaddingBottomRight: [340, 40], closeOnClick: false })
      .bindTooltip(esc(name), { permanent: true, direction: 'right', offset: [16, 0], className: 'lbl hitlbl', pane: 'searchPane' }).addTo(focusLayer);
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span>${esc(name)}<br><span class="count">Nearest: ${esc(near[0] ? near[0].r.fullName + ' (' + Math.round(near[0].d) + ' tiles)' : '—')}</span></span><span class="c">${x}, ${y}</span>`;
    li.onclick = () => { map.flyTo(ll, Math.max(map.getZoom(), 5)); m.openPopup(); };
    ol.appendChild(li);
  });
  let n = c.s.length;
  (c.ds || []).forEach(([lvl, x, y]) => {
    const i = n++; const ll = toLL(x, y); lls.push(ll);
    const e = dungeonEntrance(lvl);
    const entHtml = e ? `<div class="near"><div class="pop-meta" style="cursor:default">Nearest rune (dungeon entrance)</div><div data-x="${e.location.x}" data-y="${e.location.y}"><span class="sw" style="background:var(--gold)"></span><span>${esc(e.fullName)}<br><span class="pop-meta" style="margin:0">Click to show the entrance</span></span><span class="d">${e.location.x}, ${e.location.y}</span></div></div>` : '';
    const html = `<b>${esc(c.n)}</b><div class="pop-meta">${esc(lvl)} · X ${x}, Y ${y}</div>${entHtml}`;
    const m = L.marker(ll, { icon: hitIcon(i + 1), pane: 'searchPane' }).bindPopup(html, { autoPan: true, autoPanPaddingTopLeft: [20, 60], autoPanPaddingBottomRight: [340, 40], closeOnClick: false })
      .bindTooltip(esc(lvl), { permanent: true, direction: 'right', offset: [16, 0], className: 'lbl hitlbl', pane: 'searchPane' }).addTo(focusLayer);
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}</span><span>${esc(lvl)}<br><span class="count">${e ? 'Entrance: ' + esc(e.fullName) : 'Dungeon'}</span></span><span class="c">${x}, ${y}</span>`;
    li.onclick = () => { map.flyTo(ll, Math.max(map.getZoom(), 5)); m.openPopup(); };
    ol.appendChild(li);
  });
  (c.d || []).forEach(dn => {
    const e = dungeonEntrance(dn);
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">⌂</span><span>${esc(dn)}<br><span class="count">${e ? 'Entrance: ' + esc(e.fullName) : 'Dungeon'}</span></span>${e ? `<span class="c">${e.location.x}, ${e.location.y}</span>` : ''}`;
    if (e) {
      const ll = toLL(e.location.x, e.location.y); lls.push(ll);
      L.marker(ll, { icon: hitIcon('⌂'), pane: 'searchPane', interactive: false })
        .bindTooltip(esc(dn), { permanent: true, direction: 'right', offset: [16, 0], className: 'lbl hitlbl', pane: 'searchPane' }).addTo(focusLayer);
      li.onclick = () => map.flyTo(ll, Math.max(map.getZoom(), 5));
    }
    ol.appendChild(li);
  });
  if (!c.s.length && !(c.ds || []).length && !(c.d || []).length) ol.innerHTML = '<li><span>No known locations</span></li>';
  document.getElementById('dTitle').textContent = c.n;
  document.getElementById('dExport').style.display = 'none';
  document.getElementById('detail').classList.add('on');
  fitHits(lls);
}

// Moongates (world: blue; dungeons: red / yellow) and dungeon stairs, aligned from Outlands Butler's dungeon maps
const gateLayer = L.layerGroup(); const areaLayer = L.layerGroup().addTo(map);
let gatesOn = store.get('gatesOn', true), gatesLoaded = false;
const gateBtn = document.getElementById('gateBtn');
const icon = (url, w, h, cls = '') => L.icon({ iconUrl: url, iconSize: [w, h], iconAnchor: [w / 2, h / 2], className: 'mkicon ' + cls });
const STAIRS_SVG = '<svg viewBox="0 0 512 512"><path fill="#fff" d="m325.944 61.815l-98.26 24.566l147.158 66.891l98.263-24.566zM209.787 97.687v43.488l155.355 70.617v-43.489zM491 142.475l-108.159 27.04v62.929c-20.977 5.241-41.953 10.488-62.929 15.732v62.929c-20.977 5.241-41.953 10.488-62.929 15.732v62.93c-20.977 5.24-41.952 10.487-62.929 15.731v44.687L491 375.947zm-290.914 13.733l-35.332 8.834l147.16 66.891l35.334-8.834zm-53.228 20.14v43.488l155.355 70.617v-43.489zm-9.7 58.521l-35.333 8.834l147.16 66.891l35.334-8.834zm-53.23 20.14v43.488l155.357 70.617v-43.489zm-9.7 58.522l-35.331 8.834l147.159 66.89l35.334-8.834zM21 333.67v43.487l155.356 70.617v-43.488z"/></svg>';
const ICONS = {
  R: icon('icons/gate-red.png', 12, 24), Y: icon('icons/gate-yellow.png', 12, 24), W: icon('icons/moongate.png', 26, 26),
  // stairs icon: "3d-stairs" by Delapouite, game-icons.net (CC BY 3.0); green = up / towards the entrance, blue = deeper
  UP: L.divIcon({ className: '', html: `<div class="stairs up">${STAIRS_SVG}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }),
  DOWN: L.divIcon({ className: '', html: `<div class="stairs down">${STAIRS_SVG}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] })
};
function loadGates() {
  if (gatesLoaded) return; gatesLoaded = true;
  fetch('data/dungeon-markers.json').then(r => r.json()).then(d => {
    (d.areas || []).forEach(([name, x, y]) => L.marker(toLL(x, y), { icon: L.divIcon({ className: '', html: '', iconSize: [0, 0] }), interactive: false })
      .bindTooltip(esc(name), { permanent: true, direction: 'top', offset: [0, -4], className: 'lbl arealbl' }).addTo(areaLayer));
    d.world.forEach(([name, x, y]) => L.marker(toLL(x, y), { icon: ICONS.W }).bindTooltip(esc(name), { direction: 'top', offset: [0, -12] }).addTo(gateLayer));
    d.gates.forEach(([t, x, y, lvl]) => L.marker(toLL(x, y), { icon: ICONS[t] })
      .bindTooltip(`${t === 'R' ? 'Red' : 'Yellow'} moongate · ${esc(lvl)}`, { direction: 'top', offset: [0, -12] }).addTo(gateLayer));
    d.stairs.forEach(([x, y, lvl, label, tx, ty, tname]) => {
      const surf = label.startsWith('Dungeon entrance');
      const lvNum = n => parseFloat((String(n).match(/Level\s+([\d.]+)/i) || [])[1]);
      const up = surf || (tname ? lvNum(tname) < lvNum(lvl) : /To Level\s+([\d.]+)/i.test(label) && lvNum(label) < lvNum(lvl));
      const m = L.marker(toLL(x, y), { icon: up ? ICONS.UP : ICONS.DOWN })
        .bindTooltip(`<b>${esc(label)}</b><br>${esc(lvl)}${tname ? `<br><span style="color:#9a968c">Click to go to ${esc(tname)}</span>` : ''}`, { direction: 'top', offset: [0, -12] })
        .addTo(gateLayer);
      if (tx != null) m.on('click', () => { map.flyTo(toLL(tx, ty), Math.max(map.getZoom(), 5)); flashAt(tx, ty); });
    });
  }).catch(() => {});
}
// brief pulsing ring where a stair leads to
function flashAt(x, y) {
  const f = L.marker(toLL(x, y), { icon: L.divIcon({ className: '', html: '<div class="pin hit" style="opacity:.9"></div>', iconSize: [26, 26], iconAnchor: [13, 13] }), pane: 'searchPane', interactive: false }).addTo(map);
  setTimeout(() => f.remove(), 3500);
}
function applyGates() {
  loadGates(); if (gatesOn) gateLayer.addTo(map); else gateLayer.remove();
  gateBtn.textContent = 'Gates & stairs: ' + (gatesOn ? 'on' : 'off'); gateBtn.classList.toggle('on', gatesOn); store.set('gatesOn', gatesOn);
}
gateBtn.onclick = () => { gatesOn = !gatesOn; applyGates(); };

// Coordinate search: jump to X, Y and list the nearest runes from every set
function searchCoords(x, y, list) {
  focusLayer.clearLayers();
  const ll = toLL(x, y);
  const target = { fullName: `X ${x}, Y ${y}`, location: { x, y } };
  const from = worldPos(target) || { x, y, via: null };
  L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pin hit">✕</div>', iconSize: [26, 26], iconAnchor: [13, 13] }), pane: 'searchPane', interactive: false })
    .bindTooltip(`X ${x}, Y ${y}`, { permanent: true, direction: 'right', offset: [16, 0], className: 'lbl hitlbl', pane: 'searchPane' }).addTo(focusLayer);
  map.flyTo(ll, Math.max(map.getZoom(), 5));
  const hits = [];
  DATA.sets.forEach(s => s.books.forEach(b => bookRunes(b).forEach(r => {
    const p = worldPos(r); if (!p) return;
    hits.push({ s, b, r, d: Math.hypot(p.x - from.x, p.y - from.y), via: p.via });
  })));
  hits.sort((a, b) => a.d - b.d);
  const box = document.createElement('div'); box.className = 'set';
  box.innerHTML = `<div style="padding:10px 12px" class="count">Nearest runes to X ${x}, Y ${y}</div>`;
  const wrap = document.createElement('div'); wrap.className = 'books';
  hits.slice(0, 25).forEach(({ s, b, r, d, via }, i) => {
    const rl = toLL(r.location.x, r.location.y);
    const m = bindRune(L.marker(rl, { icon: pinIcon(i + 1), zIndexOffset: 1000 - i }), r, b)
      .bindTooltip(esc(r.fullName), { permanent: true, direction: 'right', offset: [12, 0], className: 'lbl focus' }).addTo(focusLayer);
    const el = document.createElement('div'); el.className = 'book';
    el.innerHTML = `<span class="count" style="width:18px;text-align:right;color:var(--gold)">${i + 1}</span><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(r.fullName)}<br><span class="count">${esc(b.name)}${via ? ' · via entrance' : ''}</span></span><span class="count">${Math.round(d)} tiles</span>`;
    el.onclick = () => { map.flyTo(rl, Math.max(map.getZoom(), 5)); m.openPopup(); };
    wrap.appendChild(el);
  });
  box.appendChild(wrap); list.appendChild(box);
}

function render(filter = '') {
  const list = document.getElementById('list'); list.innerHTML = '';
  const f = filter.trim().toLowerCase(); const words = f.split(/\s+/);
  document.getElementById('map').classList.toggle('searching', !!f);
  const cm = f.match(/^\s*(\d{1,4})\s*[,\s]\s*(\d{1,4})\s*$/);
  if (cm) { searchCoords(+cm[1], +cm[2], list); return; }
  if (f) {
    if (!CREATURES) loadCreatures().then(() => { if (q.value.trim().toLowerCase() === f) render(q.value); });
    const cHits = (CREATURES || []).filter(c => words.every(w => c.n.toLowerCase().includes(w)));
    if (cHits.length) {
      const cbox = document.createElement('div'); cbox.className = 'set';
      cbox.innerHTML = `<div style="padding:10px 12px" class="count">${cHits.length} creature${cHits.length === 1 ? '' : 's'}</div>`;
      const cw = document.createElement('div'); cw.className = 'books';
      cHits.slice(0, 40).forEach(c => {
        const d = document.createElement('div'); d.className = 'book';
        const nd = new Set([...(c.ds || []).map(d => d[0]), ...(c.d || [])]).size;
        const info = [c.s.length ? `${c.s.length} overworld spot${c.s.length === 1 ? '' : 's'}` : '', nd ? `${nd} dungeon level${nd === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ') || 'no known location';
        d.innerHTML = `<span class="nm">${esc(c.n)}<span class="ctag">creature</span><br><span class="count">${info}</span></span>`;
        d.onclick = () => { document.querySelectorAll('.book.active').forEach(b => b.classList.remove('active')); d.classList.add('active'); showCreature(c); };
        cw.appendChild(d);
      });
      cbox.appendChild(cw); list.appendChild(cbox);
    }
    focusLayer.clearLayers(); const hits = [];
    DATA.sets.forEach(s => s.books.forEach(b => bookRunes(b).forEach(r => {
      if (words.every(w => r.fullName.toLowerCase().includes(w))) hits.push({ s, b, r });
    })));
    if (!hits.length && cHits.length) { fitHits([]); return; }
    const box = document.createElement('div'); box.className = 'set';
    box.innerHTML = `<div style="padding:10px 12px" class="count">${hits.length} rune match${hits.length === 1 ? '' : 'es'}</div>`;
    const wrap = document.createElement('div'); wrap.className = 'books';
    const lls = [];
    hits.slice(0, 300).forEach(({ s, b, r }) => {
      const ll = toLL(r.location.x, r.location.y);
      const m = hitMarker(ll, r, b).addTo(focusLayer); lls.push(ll);
      const d = document.createElement('div'); d.className = 'book';
      d.innerHTML = `<span class="sw" style="background:${s.color}"></span><span class="nm">${esc(r.fullName)}<br><span class="count">${esc(s.setName)} · ${esc(b.name)}</span></span><span class="count">${r.location.x}, ${r.location.y}</span>`;
      d.onclick = () => { map.flyTo(ll, 5); m.openPopup(); };
      wrap.appendChild(d);
    });
    box.appendChild(wrap); list.appendChild(box); fitHits(lls);
    return;
  }
  DATA.sets.forEach(s => {
    const det = document.createElement('details'); det.className = 'set';
    const total = s.books.reduce((m, b) => m + b.runeIds.length, 0);
    det.innerHTML = `<summary><input type="checkbox" title="Show whole set as overlay"><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.setName)}</span><span class="count">${total} runes</span></summary>`;
    const setBox = det.querySelector('input');
    setBox.onclick = e => e.stopPropagation();
    setBox.onchange = () => {
      s.books.forEach(b => setBox.checked ? overlays.add(bookKey(s, b)) : overlays.delete(bookKey(s, b)));
      det.querySelectorAll('.book input').forEach(i => i.checked = setBox.checked);
      drawOverlays();
    };
    syncSetBox(s, setBox);
    const links = document.createElement('div'); links.className = 'setlinks';
    const ex = document.createElement('button'); ex.className = 'btn'; ex.textContent = 'Export set XML';
    ex.onclick = () => exportXml('Travel Agency - ' + s.setName, s.books.flatMap(bookRunes));
    links.appendChild(ex);
    const books = document.createElement('div'); books.className = 'books';
    s.books.forEach(b => {
      const d = document.createElement('div'); d.className = 'book';
      d.innerHTML = `<input type="checkbox" title="Show as overlay"><span class="nm">${esc(b.name)}</span><span class="count">${b.runeIds.length}</span>`;
      const cb = d.querySelector('input');
      cb.checked = overlays.has(bookKey(s, b));
      cb.onclick = e => e.stopPropagation();
      cb.onchange = () => { cb.checked ? overlays.add(bookKey(s, b)) : overlays.delete(bookKey(s, b)); syncSetBox(s, setBox); drawOverlays(); };
      d.onclick = () => showBook(s, b, d);
      books.appendChild(d);
    });
    det.append(links, books); list.appendChild(det);
  });
}

const q = document.getElementById('q'), sbox = document.getElementById('sbox');
q.addEventListener('input', e => { sbox.classList.toggle('has', !!q.value); render(q.value); });
document.getElementById('qclear').onclick = () => { q.value = ''; sbox.classList.remove('has'); render(''); q.focus(); };
q.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('qclear').click(); });

// Overlay labels: auto (show when zoomed in), or forced on/off via the Labels button

const lblBtn = document.getElementById('lblBtn'), mapEl = document.getElementById('map');
function updateLabels() {
  scheduleLabels();
  lblBtn.textContent = 'Labels: ' + labelMode; lblBtn.classList.toggle('on', labelMode !== 'off');
}
lblBtn.onclick = () => { labelMode = { auto: 'on', on: 'off', off: 'auto' }[labelMode]; store.set('labelMode', labelMode); updateLabels(); };
updateLabels();
document.getElementById('dClose').onclick = () => {
  document.getElementById('detail').classList.remove('on'); focusLayer.clearLayers(); current = null;
  document.querySelectorAll('.book.active').forEach(b => b.classList.remove('active'));
};
document.getElementById('dExport').onclick = () => current && exportXml(current.book.name, bookRunes(current.book));
document.getElementById('clearOv').onclick = () => { overlays.clear(); drawOverlays(); render(document.getElementById('q').value); };

fetch('data/library.json').then(r => r.json()).then(d => {
  DATA = d; RUNES = d.runes;
  Object.values(RUNES).forEach(r => r.fullName = r.fullName || r.shortName || r.id);
  Object.values(RUNES).forEach(r => { if (r.location && r.location.x < SURFACE_W && /\s+entrance$/i.test(r.fullName))
    ENTR[r.fullName.replace(/\s+entrance$/i, '').toLowerCase()] = r; });
  DATA.sets.sort((a, b) => a.setName.localeCompare(b.setName));
  DATA.sets.forEach((s, i) => s.color = s.color || PALETTE[i % PALETTE.length]);
  const nRunes = DATA.sets.reduce((n, s) => n + s.books.reduce((m, b) => m + b.runeIds.length, 0), 0);
  const nBooks = DATA.sets.reduce((n, s) => n + s.books.length, 0);
  document.getElementById('stats').textContent = `${DATA.sets.length} sets · ${nBooks} books · ${nRunes} runes`;
  render(); drawOverlays(); applyGates();
}).catch(err => { document.getElementById('stats').textContent = 'Could not load data/library.json'; console.error(err); });
</script>
